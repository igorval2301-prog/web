<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налаштування профілю</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
<main class="card" id="card">
    <h1>Налаштування профілю</h1>
    <p id="welcome">Вітаємо, гостю!</p>

    <label for="userName">Ваше ім'я</label>
    <input id="userName" type="text" placeholder="Введіть ім'я">

    <label for="themeSelect">Тема</label>
    <select id="themeSelect">
        <option value="light">Світла</option>
        <option value="dark">Темна</option>
    </select>

    <button id="confirmBtn">Підтвердити</button>
    <p id="statusText">Налаштування ще не збережені</p>

    <button id="infoBtn" class="secondary">Показати додаткову інформацію</button>
    <p class="hidden" id="info">Тут можна змінити ім'я та тему оформлення профілю.</p>
</main>

<script src="script.js"></script>
</body>
</html>
